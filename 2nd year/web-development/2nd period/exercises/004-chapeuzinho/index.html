<!DOCTYPE html>
<html>

<head>
    <title>Consulta (Chapeuzinho)</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>    
    <div class="container">
        <div>
            <h2> Quitutes de Clientina </h2>

        </div>

        <div>
            <h3> Atribuições de Internetina</h3>
            <span>Mensagem</span>
            <select id="tipoDeEnvio">
                <option value="verificarReposicao">Há algo que precisa ser reposto?</option>
                <option value="enviarReposicao">Irei mandar...</option>

            </select>

            <button onclick="enviarInternetina()">Enviar internetina</button>

        </div>

        <hr>

        <div>
            <h3> Respostas de Servidorina</h3>
            <p id="respostasServidorina"></p>
            <div class="resultadoTodas"></div>

        </div>

    </div>

    <div class="container">
        <h2> Dispensa Básica, de Servidorina</h2>
        <button onclick="listarEstoque()"> Como está o meu estoque?</button>
        
        <div id="resultadoTodas" class="resultado">...</div>

    </div>

    <!-- Listar pessoas-->
    <div class="container" style="display:none">
        <h3>Todas as Pessoas</h3>
        <button onclick="listarTodas()">Listar Todas</button>
        <div id="resultadoTodas" class="resultado">...</div>

    </div>

    <!-- CPF-->
    <div class="container" style="display:none">
        <h3>Buscar por CPF (Chave Primária)</h3>
        <label for="inputCpf">CPF:</label>
        <input type="text" id="inputCpf" placeholder="Digite o CPF (ex: 12345678900)">
        <button onclick="buscarPorCPF()">Buscar</button>
        <div id="resultadoCPF" class="resultado">...</div>
    </div>

    <!-- Nome-->
    <div class="container" style="display:none">
        <h3>Buscar por Nome</h3>
        <label for="inputNome">Nome:</label>
        <input type="text" id="inputNome" placeholder="Digite o nome (ou parte dele)">
        <button onclick="buscarPorNome()">Buscar</button>
        <div id="resultadoNome" class="resultado">...</div>
    </div>

    <script src="scriptsUsados.js"></script>
</body>

</html>
